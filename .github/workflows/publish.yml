name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM provenance signatures
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build

      - name: Publish @sola-air-ui/sentinel
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/sentinel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sola/core
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sola/behavior
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/behavior
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sola/relay
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/relay
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sola-air-ui/tokens
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sola-air-ui/providers
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/providers
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sola-air-ui/mcp
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/sola-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sola/compiler
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/compiler
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sola/ui
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @sola/vite-plugin-sola
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/vite-plugin-sola
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-sola
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/create-sola
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish sola-air (meta-package, last because it depends on the others)
        run: node "$GITHUB_WORKSPACE/scripts/publish-if-new.mjs"
        working-directory: packages/sola-air
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
