name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  no-local-config:
    name: No local tooling config committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # AGENTS.md once carried a generated block describing a contributor's
      # local agent setup — tool routing, connected accounts, personas. The
      # generator rewrites that block automatically, so without this check it
      # returns to a public repo the next time anyone runs it.
      - name: Reject generated local-tooling blocks
        run: |
          if git grep -In -e 'pandaos-managed' -e 'mcp__pandactions' \
               -- . ':!.github/workflows/ci.yml' ; then
            echo "::error::A generated local-tooling block is committed. Remove it before merging."
            exit 1
          fi
          echo "No local tooling config found in tracked files."

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build core IIFE bundle
        run: npm run build -w @sola-air-ui/core
      - run: npx playwright install --with-deps chromium

      # No dev server needed: these compile components and mount them directly.
      - name: Docs snippets and library components
        run: npx playwright test e2e/docs-snippets.spec.ts e2e/ui-components.spec.ts e2e/shell-primitives.spec.ts e2e/sola-export.spec.ts e2e/composition.spec.ts e2e/sola-skill.spec.ts

      # These drive the real site, so they need it running.
      - name: Build the site
        run: npm run build
      - name: Site quality and audit
        run: |
          npm run dev -w app -- --port 5174 --strictPort &
          npx wait-on http://localhost:5174 --timeout 60000
          npx playwright test e2e/site-quality.spec.ts e2e/site-audit.spec.ts e2e/a11y.spec.ts e2e/home-bus.spec.ts e2e/home-data.spec.ts e2e/home-flagship.spec.ts e2e/components-overlays.spec.ts e2e/written-in-sola.spec.ts e2e/studio.spec.ts

  scaffold:
    name: Scaffold installs and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Runs the real command a new user runs, against the real registry, and
      # builds the result. This is the check that would have caught the
      # scaffold pinning package versions that were never published.
      - name: Scaffold a project
        run: node "$GITHUB_WORKSPACE/packages/create-sola/src/cli.js" smoke-app
        working-directory: ${{ runner.temp }}

      - name: Install scaffolded dependencies
        run: npm install
        working-directory: ${{ runner.temp }}/smoke-app

      - name: Build scaffolded project
        run: npm run build
        working-directory: ${{ runner.temp }}/smoke-app

      - name: Assert the build produced output
        run: test -d dist && test -n "$(ls -A dist)"
        working-directory: ${{ runner.temp }}/smoke-app
