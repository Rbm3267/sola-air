name: Publish VS Code extension

# Manual only. Builds the .vsix and publishes it to whichever registries have a
# token configured: VSCE_PAT (Visual Studio Marketplace) and/or OVSX_PAT (Open VSX).
# With neither secret set it still builds the .vsix and attaches it to the run.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/vscode-extension
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Package the extension
        run: npx --yes @vscode/vsce package --no-dependencies --out sola-vscode.vsix

      - name: Keep the .vsix
        uses: actions/upload-artifact@v6
        with:
          name: sola-vscode-vsix
          path: packages/vscode-extension/sola-vscode.vsix

      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath sola-vscode.vsix --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish sola-vscode.vsix --pat "$OVSX_PAT"
