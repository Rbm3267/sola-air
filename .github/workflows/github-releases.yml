name: GitHub Releases

# Creates a GitHub Release for each package whose current version has a CHANGELOG
# entry and no release yet (tags look like core-v1.5.0). Runs after a successful
# "Publish to NPM", or by hand. Safe to run again: existing releases are skipped.
on:
  workflow_run:
    workflows: ['Publish to NPM']
    types: [completed]
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Create releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/github-releases.mjs
