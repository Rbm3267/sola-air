<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="google-site-verification" content="WcTmhJBtVJPU0tzzt4XiIY4AfSDAywCA6RTgfowxVcw" />
		<meta name="postbuild-verification" content="postbuild-verify=b6d5178bd05c4737a9238afe402c4cef" />
		<title>Sola AIR — Ambient Intent Runtime</title>
		<!--
			Default link-preview tags. Every page renders in the browser only (ssr = false), so
			Slack, LinkedIn, X and similar crawlers, which do not run JavaScript, see nothing but
			this file. The root layout sets the same tags per route once the app loads and
			removes these (data-default-meta) so a page never carries two of each.
		-->
		<meta data-default-meta name="description" content="A small reactive runtime and compiler. You write .sola components and they compile to plain DOM calls, with no virtual DOM." />
		<meta data-default-meta property="og:type" content="website" />
		<meta data-default-meta property="og:site_name" content="Sola AIR" />
		<meta data-default-meta property="og:title" content="Sola AIR — Ambient Intent Runtime" />
		<meta data-default-meta property="og:description" content="A small reactive runtime and compiler. You write .sola components and they compile to plain DOM calls, with no virtual DOM." />
		<meta data-default-meta property="og:image" content="https://sola-air.dev/og-image.jpg" />
		<meta data-default-meta name="twitter:card" content="summary_large_image" />
		<!--
			Structured data for search engines. It lives here, not in a route, because pages
			render in the browser only and crawlers read this file without running JavaScript.
			It has no data-default-meta attribute, so the root layout leaves it in place.
		-->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Sola AIR",
				"alternateName": "Ambient Intent Runtime",
				"applicationCategory": "DeveloperApplication",
				"operatingSystem": "Web",
				"description": "A small reactive runtime and compiler. You write .sola components and they compile to plain DOM calls, with no virtual DOM.",
				"url": "https://sola-air.dev",
				"codeRepository": "https://github.com/Rbm3267/sola-air",
				"license": "https://spdx.org/licenses/MIT.html",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
				"author": { "@type": "Organization", "name": "XD Labs", "url": "https://xdlabs.io" }
			}
		</script>
		<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!--
			Vercel Web Analytics and Speed Insights, added with Vercel's documented script
			snippets. The @vercel/analytics and @vercel/speed-insights SvelteKit helpers import
			$app/stores, which SvelteKit 3 removed, so no released version of either works with
			it. Both scripts are served by Vercel at these paths and are a 404 anywhere else.
		-->
		<script>
			window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
			window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
		</script>
		<script defer src="/_vercel/insights/script.js"></script>
		<script defer src="/_vercel/speed-insights/script.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
